<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Power Button</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div
    class="power-btn"
    id="main"
    data-state="off"
    role="switch"
    aria-checked="false"
    tabindex="0"
    aria-label="Power switch"
  >
    <div class="body">
      <div class="sheen"></div>
      <div class="groove">
        <div class="cap">
          <div class="face">
            <div class="bloom"></div>
            <svg class="glyph glyph-glow-wide" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <path d="M67.85 30.19 A27.8 27.8 0 1 1 32.15 30.19" />
              <path d="M50 20 V51.5" />
            </svg>
            <svg class="glyph glyph-glow-mid" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <path d="M67.85 30.19 A27.8 27.8 0 1 1 32.15 30.19" />
              <path d="M50 20 V51.5" />
            </svg>
            <svg class="glyph glyph-crisp" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
              <path d="M67.85 30.19 A27.8 27.8 0 1 1 32.15 30.19" />
              <path d="M50 20 V51.5" />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
