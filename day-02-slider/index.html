<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day 02 · Slider</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div
    class="slider"
    id="slider"
    role="slider"
    tabindex="0"
    aria-label="Level"
    aria-orientation="horizontal"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="44"
  >
    <div class="track" id="track">
      <div class="fill" id="fill"></div>
      <div class="knob" id="knob">
        <svg class="knob-svg" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <!-- Dark gray base ring revealed as the white light retreats -->
          <circle class="ring-base" cx="50" cy="50" r="32.5" />
          <!-- Top and bottom white light arcs anchored at 9 o'clock (17.5, 50) and meeting at 3 o'clock (82.5, 50) -->
          <path
            class="ring-light"
            id="ringTop"
            pathLength="100"
            d="M 17.5 50 A 32.5 32.5 0 0 1 82.5 50"
          />
          <path
            class="ring-light"
            id="ringBot"
            pathLength="100"
            d="M 17.5 50 A 32.5 32.5 0 0 0 82.5 50"
          />
          <!-- Solid black inner circle -->
          <circle class="ring-pit" cx="50" cy="50" r="21" />
        </svg>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
