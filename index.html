<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Explorations</title>
  <style>
    :root {
      --page: #121212;
      --cell: #171717;
      --line: #2c2c2c;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;

      /* 12-column grid: no gutter; cell borders form the column rules */
      --columns: 12;
      --inset: 18px;
      --margin: clamp(20px, 7vw, 64px);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-inline: var(--margin);
      background: var(--page);
      color: var(--text);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
    }

    /* shared 12-column measure */
    .grid-12 {
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
    }

    header {
      padding: clamp(26px, 3.6vw, 52px) 0 clamp(28px, 5vw, 64px);
    }

    header .grid-12 { align-items: end; }

    h1 {
      grid-column: 1 / span 10;
      margin: 0;
      padding: 0;
      font-size: clamp(34px, 5.4vw, 68px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: 0.01em;
    }

    h1 span { display: block; }

    /* ---- component grid ---- */

    .grid {
      flex: 1;
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .cell {
      grid-column: span 3;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: calc(clamp(250px, 33vh, 400px) + var(--row-extra, 0px));
      background: var(--cell);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .cell-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px var(--inset);
    }

    .cell-titles { display: flex; flex-direction: column; gap: 4px; }

    .day {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .name {
      font-size: 13px;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .expand {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      padding: 0;
      flex: 0 0 auto;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .expand:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .expand:focus { outline: none; }
    .expand:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.35); outline-offset: 2px; }
    .expand svg { width: 15px; height: 15px; }

    .stage {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    .stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    .cell--empty .cell-head { opacity: 0.55; }

    /* ---- viewer ---- */

    .viewer {
      width: min(94vw, 780px);
      height: min(92vh, 800px);
      height: min(92dvh, 800px);
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: var(--mono);
    }

    .viewer::backdrop {
      background: rgba(6, 6, 6, 0.82);
      backdrop-filter: blur(6px);
    }

    .viewer-inner {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--cell);
      border: 1px solid var(--line);
    }

    .viewer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px var(--inset);
      border-bottom: 1px solid var(--line);
    }

    .viewer-close {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 4px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .viewer-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .viewer-close:focus { outline: none; }
    .viewer-close:focus-visible { outline: 1px solid rgba(255, 255, 255, 0.35); outline-offset: 2px; }

    .viewer-stage { flex: 1; min-height: 0; }

    .viewer-stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    /* ---- responsive column spans ---- */

    @media (max-width: 760px) { .cell { grid-column: span 6; } }
    @media (max-width: 600px) {
      .cell { grid-column: span 12; }
      h1 { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header>
    <div class="grid-12">
      <h1><span>UI</span><span>Explorations</span></h1>
    </div>
  </header>

  <main class="grid grid-12" id="grid">
    <section class="cell" data-day="Day 02" data-name="Slider" data-src="day-02-slider/index.html">
      <div class="cell-head">
        <div class="cell-titles">
          <span class="day">Day 02</span>
          <span class="name">Slider</span>
        </div>
        <button class="expand" type="button" aria-label="Expand Slider">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7" />
            <path d="M9 7h8v8" />
          </svg>
        </button>
      </div>
      <div class="stage">
        <iframe
          src="day-02-slider/index.html?embed=1"
          title="Day 02 — Slider"
        ></iframe>
      </div>
    </section>

    <section class="cell" data-day="Day 01" data-name="Power Button" data-src="day-01-power-button/index.html">
      <div class="cell-head">
        <div class="cell-titles">
          <span class="day">Day 01</span>
          <span class="name">Power Button</span>
        </div>
        <button class="expand" type="button" aria-label="Expand Power Button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17 17 7" />
            <path d="M9 7h8v8" />
          </svg>
        </button>
      </div>
      <div class="stage">
        <iframe
          src="day-01-power-button/index.html?embed=1"
          title="Day 01 — Power Button"
        ></iframe>
      </div>
    </section>

    <section class="cell cell--empty" aria-hidden="true"></section>
    <section class="cell cell--empty" aria-hidden="true"></section>
  </main>

  <dialog class="viewer" id="viewer">
    <div class="viewer-inner">
      <div class="viewer-head">
        <div class="cell-titles">
          <span class="day" id="viewerDay">Day 01</span>
          <span class="name" id="viewerName">Power Button</span>
        </div>
        <button class="viewer-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="viewer-stage" id="viewerStage"></div>
    </div>
  </dialog>

  <script>
    const grid = document.getElementById("grid");

    /*
     * Newest first: order the component cells by day number, descending,
     * so new work always lands top-left regardless of where it sits in the markup.
     */
    (function orderNewestFirst() {
      const cells = [...grid.children];
      const dated = cells.filter((cell) => cell.dataset.name);
      const rest = cells.filter((cell) => !cell.dataset.name);

      const dayNumber = (cell) => {
        const match = (cell.dataset.day || "").match(/\d+/);
        return match ? Number(match[0]) : 0;
      };

      dated
        .map((cell, index) => ({ cell, index }))
        .sort((a, b) => dayNumber(b.cell) - dayNumber(a.cell) || a.index - b.index)
        .forEach(({ cell }) => grid.appendChild(cell));

      rest.forEach((cell) => grid.appendChild(cell));
    })();

    /*
     * Complete the 12-column grid and fill the viewport height, so the page
     * always reads as a full 12-col sheet with no dead space.
     */
    const autoCells = [];

    function fillGrid() {
      autoCells.forEach((cell) => cell.remove());
      autoCells.length = 0;
      grid.style.removeProperty("--row-extra");

      const first = grid.querySelector(".cell");
      if (!first) return;

      const cellWidth = first.getBoundingClientRect().width;
      const perRow = Math.max(1, Math.round(grid.clientWidth / cellWidth));

      while (grid.children.length % perRow !== 0) {
        const cell = document.createElement("section");
        cell.className = "cell cell--empty";
        cell.setAttribute("aria-hidden", "true");
        grid.appendChild(cell);
        autoCells.push(cell);
      }

      const available = window.innerHeight - grid.getBoundingClientRect().top;
      const rowHeight = first.getBoundingClientRect().height;
      if (available <= 0 || rowHeight <= 0) return;

      let rows = grid.children.length / perRow;
      const needed = Math.ceil(available / rowHeight);
      let guard = 0;

      while (rows < needed && guard < 40) {
        for (let i = 0; i < perRow; i += 1) {
          const cell = document.createElement("section");
          cell.className = "cell cell--empty";
          cell.setAttribute("aria-hidden", "true");
          grid.appendChild(cell);
          autoCells.push(cell);
        }
        rows += 1;
        guard += 1;
      }

      const leftover = available - rows * rowHeight;
      if (leftover > 0) {
        grid.style.setProperty("--row-extra", `${leftover / rows}px`);
      }
    }

    fillGrid();

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(fillGrid, 120);
    });

    /* ---- expandable viewer ---- */

    const viewer = document.getElementById("viewer");
    const viewerStage = document.getElementById("viewerStage");
    const viewerDay = document.getElementById("viewerDay");
    const viewerName = document.getElementById("viewerName");

    document.querySelectorAll(".cell[data-name]").forEach((cell) => {
      const button = cell.querySelector(".expand");
      if (!button) return;

      button.addEventListener("click", () => {
        viewerDay.textContent = cell.dataset.day;
        viewerName.textContent = cell.dataset.name;

        const frame = document.createElement("iframe");
        frame.src = `${cell.dataset.src}?embed=1`;
        frame.title = `${cell.dataset.day} — ${cell.dataset.name}`;
        viewerStage.replaceChildren(frame);

        viewer.showModal();
      });
    });

    const closeViewer = () => {
      viewer.close();
      viewerStage.replaceChildren();
    };

    viewer.querySelector(".viewer-close").addEventListener("click", closeViewer);

    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) closeViewer();
    });

    viewer.addEventListener("close", () => viewerStage.replaceChildren());
  </script>
</body>
</html>
