<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UI Explorations</title>
  <style>
    :root {
      --page: #121212;
      --cell: #171717;
      --line: #2c2c2c;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html, body { min-height: 100%; margin: 0; }

    body {
      background: var(--page);
      color: var(--text);
      font-family: var(--mono);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 clamp(20px, 3vw, 40px);
    }

    header {
      padding: clamp(32px, 5vw, 56px) 0 clamp(28px, 4vw, 44px);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5.4vw, 68px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: 0.01em;
    }

    h1 span { display: block; }

    /* ---- grid ---- */

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--line);
      border-left: 1px solid var(--line);
    }

    .cell {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: clamp(260px, 28vw, 380px);
      background: var(--cell);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .cell-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
    }

    .cell-titles { display: flex; flex-direction: column; gap: 4px; }

    .day {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .name {
      font-size: 13px;
      letter-spacing: 0.01em;
      color: var(--text);
    }

    .expand {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      padding: 0;
      flex: 0 0 auto;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .expand:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .expand svg { width: 15px; height: 15px; }

    .stage {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    .stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    .cell--empty .cell-head { opacity: 0.55; }

    /* ---- viewer ---- */

    .viewer {
      width: min(92vw, 760px);
      height: min(92vh, 780px);
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font-family: var(--mono);
    }

    .viewer::backdrop {
      background: rgba(6, 6, 6, 0.82);
      backdrop-filter: blur(6px);
    }

    .viewer-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--cell);
      border: 1px solid var(--line);
    }

    .viewer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .viewer-close {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 4px;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .viewer-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }

    .viewer-close:focus { outline: none; }

    .viewer-close:focus-visible {
      outline: 1px solid rgba(255, 255, 255, 0.35);
      outline-offset: 2px;
    }

    .viewer-stage { flex: 1; min-height: 0; }

    .viewer-stage iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1><span>UI</span><span>Explorations</span></h1>
    </header>
  </div>

  <div class="shell" style="padding-bottom: 64px;">
    <main class="grid">
      <section class="cell" data-day="Day 01" data-name="Power Button">
        <div class="cell-head">
          <div class="cell-titles">
            <span class="day">Day 01</span>
            <span class="name">Power Button</span>
          </div>
          <button class="expand" type="button" aria-label="Expand Power Button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 17 17 7" />
              <path d="M9 7h8v8" />
            </svg>
          </button>
        </div>
        <div class="stage">
          <iframe
            src="day-01-power-button/index.html?embed=1&size=200"
            title="Day 01 — Power Button"
          ></iframe>
        </div>
      </section>

      <section class="cell cell--empty">
        <div class="cell-head">
          <div class="cell-titles">
            <span class="day">Day 02</span>
            <span class="name">Upcoming</span>
          </div>
        </div>
      </section>

      <section class="cell cell--empty" aria-hidden="true"></section>
      <section class="cell cell--empty" aria-hidden="true"></section>
    </main>
  </div>

  <dialog class="viewer" id="viewer">
    <div class="viewer-inner">
      <div class="viewer-head">
        <div class="cell-titles">
          <span class="day" id="viewerDay">Day 01</span>
          <span class="name" id="viewerName">Power Button</span>
        </div>
        <button class="viewer-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="viewer-stage" id="viewerStage"></div>
    </div>
  </dialog>

  <script>
    const viewer = document.getElementById("viewer");
    const viewerStage = document.getElementById("viewerStage");
    const viewerDay = document.getElementById("viewerDay");
    const viewerName = document.getElementById("viewerName");

    document.querySelectorAll(".cell[data-name]").forEach((cell) => {
      const button = cell.querySelector(".expand");
      if (!button) return;

      button.addEventListener("click", () => {
        viewerDay.textContent = cell.dataset.day;
        viewerName.textContent = cell.dataset.name;

        const frame = document.createElement("iframe");
        frame.src = `day-01-power-button/index.html?embed=1&size=420`;
        frame.title = `${cell.dataset.day} — ${cell.dataset.name}`;
        viewerStage.replaceChildren(frame);

        viewer.showModal();
      });
    });

    const closeViewer = () => {
      viewer.close();
      viewerStage.replaceChildren();
    };

    viewer.querySelector(".viewer-close").addEventListener("click", closeViewer);

    /* click on the backdrop closes */
    viewer.addEventListener("click", (event) => {
      if (event.target === viewer) closeViewer();
    });

    viewer.addEventListener("close", () => viewerStage.replaceChildren());
  </script>
</body>
</html>
